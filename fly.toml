# fly.toml app configuration file generated for farv-ia on 2026-10-01T09:50:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'farv-ia'
primary_region = 'gru'

[build]
[env]
  DATA_DIR = '/data'
  DEBUG = 'false'
  DEFAULT_PROVIDER = 'mock'
  PORT = '8000'
  STATIC_FRONTEND_DIR = '/app/frontend_dist'

[[mounts]]
  source = 'farv_ia_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

# fly.toml app configuration file for FARV-IA
# Reference: https://fly.io/docs/reference/configuration/

app = "farv-ia"
primary_region = "gru"

[build]

[env]
  PORT = "8000"
  DATA_DIR = "/data"
  STATIC_FRONTEND_DIR = "/app/frontend_dist"
  DEFAULT_PROVIDER = "mock"
  DEBUG = "false"

[mounts]
  source = "farv_ia_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
